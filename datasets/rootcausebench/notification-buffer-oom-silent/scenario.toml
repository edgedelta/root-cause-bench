[commits]
innocent_count = 28

[[commits.authored]]
id = "culprit"
message = "feat(notify): batch webhook dispatch"
author = "marco.silva"
timestamp = "2026-07-21T08:05:00Z"
files = ["services/notification/dispatch.go"]
diff = '''--- a/services/notification/dispatch.go
+++ b/services/notification/dispatch.go
@@ -22,14 +22,12 @@ type Dispatcher struct {
-	// bounded queue: drop-on-full keeps memory flat under consumer slowdowns
-	queue chan Event // cap 10_000
+	mu    sync.Mutex
+	batch []Event
 }

 func (d *Dispatcher) Enqueue(ev Event) {
-	select {
-	case d.queue <- ev:
-	default:
-		metrics.Inc("notify_dropped_total")
-	}
+	d.mu.Lock()
+	d.batch = append(d.batch, ev)
+	d.mu.Unlock()
 }
'''

[[commits.authored]]
id = "workflow-decoy"
message = "fix(workflow): improve dispatch error logging"
author = "priya.nair"
timestamp = "2026-07-21T09:30:00Z"
files = ["services/workflow/notify.go"]
diff = '''--- a/services/workflow/notify.go
+++ b/services/workflow/notify.go
@@ -55,1 +55,2 @@
-		log.Error("notify dispatch failed")
+		log.Error("notify dispatch failed: " + err.Error())
'''

[[deploys]]
service = "notification-svc"
commit = "culprit"
timestamp = "2026-07-21T08:40:00Z"
[[deploys]]
service = "workflow-engine"
commit = "workflow-decoy"
timestamp = "2026-07-21T09:52:00Z"

[ground_truth]
culprit_id = "culprit"
blast_radius = ["workflow-engine", "platform-api"]
remediation = "rollback"
decoy_ids = ["workflow-decoy"]
notes = "DEGRADED TELEMETRY / SILENT FAILING SERVICE (adversarial). notification-svc's own logs STOP at onset 09:40 (the process OOMs; its logging dies with it) — there is not a single notification-svc log line after onset, and that absence is the primary clue. Culprit is the batch-webhook-dispatch commit (deployed 08:40): it replaces the bounded drop-on-full channel with an unbounded batch slice, so under a consumer backlog dispatch_queue_depth and container_memory_rss_mb ramp from 08:40 until the 4GB OOMKill at 09:40 (rss flat-lines, container_restarts steps to 7, CrashLoopBackOff). Peers tell the story: workflow-engine spams 'connection refused to notification-svc:8080' from 09:40 and platform-api enqueue errors follow at 09:44. The TEMPTING answer is workflow-decoy — workflow-engine is the loudest service, it owns the alert, and it deployed at 09:52, six minutes before the alert fired; but its diff only enriches an error-log message, and the connection-refused errors predate its deploy by 12 minutes. first_failing_service is notification-svc even though it is silent. Remediation: roll back notification-svc to the bounded-queue build."
