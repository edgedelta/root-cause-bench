[ground_truth]
culprit_id = "culprit"
blast_radius = ["workflow-engine", "platform-api"]
remediation = "rollback"
decoy_ids = ["workflow-decoy", "keepalive-decoy", "fanout-decoy", "compress-decoy"]
notes = "DEGRADED TELEMETRY / SILENT FAILING SERVICE (adversarial, v3 — comment-free culprit diff, deeper candidate set). notification-svc's own logs STOP at onset 09:40 (the process OOMs; its logging dies with it) — there is not a single notification-svc log line after onset, and that absence is the primary clue; there is likewise no healthy notification-svc span in any post-onset trace. Culprit is the batch-webhook-dispatch commit (authored 08:05, deployed 08:40): its diff is comment-free on both sides — no annotation announces what safety property is being removed — so the fault must be read from Go semantics alone: the old code guards a fixed-capacity `chan Event` with a `select`/`default` that drops (and counts, via `notify_dropped_total`) any event once the channel is full, i.e. a hard memory ceiling; the new code replaces it with a `sync.Mutex` guarding an `append`-only `[]Event` slice with no capacity bound and no drop path, so every accepted event is retained forever. Under a consumer backlog, dispatch_queue_depth and container_memory_rss_mb ramp from 08:40 until the 4GB OOMKill at 09:40 (rss flat-lines, container_restarts steps to 7, CrashLoopBackOff). Peers tell the story: workflow-engine spams 'connection refused to notification-svc:8080' from 09:40 (8/min) and platform-api enqueue errors follow at 09:44 (5/min). Timing alone no longer exonerates anything here — 14 auto-generated background deploys land across the three services (>=5 pre-onset), plus four authored innocents/decoys deploy before onset, so every exoneration below is mechanism-based. workflow-decoy (workflow-engine, deployed 09:20, PRE-onset) is the most dangerous bait: the workflow-engine connection-refused errors literally START right after its deploy (09:40 onset, 20 minutes later), making it look causal and it owns the alerting service besides. It is exonerated purely by mechanism: its diff only enriches an existing error-log line with `err.Error()` — it cannot manufacture a downstream connection-refused condition — and the notification-svc rss ramp that actually explains the outage began at 08:40, a full 40 minutes before workflow-decoy even deployed. keepalive-decoy ('perf(notify): tune webhook client keepalive', notification-svc, deployed 09:10) is the scariest suspect of all: right service, pre-onset, deployed squarely mid-ramp while memory is already climbing. It is exonerated because the ramp's START (08:40) predates its 09:10 deploy by 30 minutes, and its diff touches only the HTTP client's MaxIdleConns/IdleConnTimeout keepalive settings — orthogonal to the unbounded append growth that actually drives the OOM. fanout-decoy ('feat(workflow): parallel dispatch fan-out', workflow-engine, authored 08:35, deployed 09:00, PRE-onset) is the deepest trap: doubling the workflow-engine worker pool from 4 to 8 would plausibly double producer traffic into an already-fragile notification-svc, and it deploys to the very service that owns the alert. It is exonerated by flags.json: the new pool size is gated behind `workflow_parallel_dispatch`, created OFF by priya.nair at 08:30 and never flipped for the rest of the window, so the fan-out path never executes and producer volume into notification-svc never changes. compress-decoy ('perf(notify): compress webhook payloads', notification-svc, authored 07:50, deployed 08:05 — BEFORE the culprit) wraps outbound payload marshaling in gzip and is exonerated two ways: (a) mechanism — compressing a payload before send can only shrink per-event memory, the wrong direction for an RSS explosion; (b) timing — container_memory_rss_mb sits flat at baseline for the 35 minutes between this deploy (08:05) and the culprit deploy (08:40), where the ramp visibly begins in lockstep with dispatch_queue_depth, so the compression deploy demonstrably coexisted with normal memory for over half an hour before anything went wrong. first_failing_service is notification-svc even though it is silent. Patterns: workflow-engine's connection-refused ERROR (8/min) stays the loudest negative pattern; platform-api's enqueue-failure ERROR is louder than before (5/min, up from 3) but still second; notification-svc contributes zero fault patterns (its logs died with it); 3 `[[patterns_extra]]` stale background negatives (kafka consumer lag on billing-worker, disk usage on auth-gateway, TLS renewal on search-indexer; counts 48-74, delta +2) sit below both incident patterns, unrelated pre-existing chatter on uninvolved services. Noise: jitter of 0.05 on container_memory_rss_mb and 0.2 on notification_dispatch_error_ratio; a workflow-engine step_retry_count spike (baseline ~2 -> 46) from 07:00-07:30 self-heals a full two hours before onset and is unrelated red-herring noise. Remediation: roll back notification-svc to the pre-batch-dispatch build."
