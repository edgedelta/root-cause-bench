message = "perf(config-svc): add response compression"
author = "lena.fischer"
timestamp = "2026-07-24T14:35:00Z"
files = ["services/config-svc/handler.go"]
diff = '''--- a/services/config-svc/handler.go
+++ b/services/config-svc/handler.go
@@ -15,6 +15,10 @@ func (h *Handler) ServeConfig(w http.ResponseWriter, r *http.Request) {
-	body, _ := json.Marshal(cfg)
-	w.Write(body)
+	body, _ := json.Marshal(cfg)
+	w.Header().Set("Content-Encoding", "gzip")
