[[commits.authored]]
id = "culprit"
message = "refactor(pipeline): per-record config resolution"
author = "grace.oyelaran"
timestamp = "2026-07-24T15:00:00Z"
files = ["services/pipeline-transformer/transform.go"]
diff = '''--- a/services/pipeline-transformer/transform.go
+++ b/services/pipeline-transformer/transform.go
@@ -18,16 +18,15 @@ func (s *Server) ProcessBatch(ctx context.Context, batch []Record) error {
-	cfg, err := s.config.Get(ctx, batch[0].Type)
-	if err != nil {
-		return err
-	}
 	for _, rec := range batch {
+		cfg, err := s.config.Get(ctx, rec.Type)
+		if err != nil {
+			return err
+		}
 		out, err := s.transformRecord(ctx, rec, cfg)
 		if err != nil {
 			return err
 		}
 		s.sink.Write(out)
 	}
 	s.emitBatchFlushed(len(batch))
 	return nil
 }
'''

