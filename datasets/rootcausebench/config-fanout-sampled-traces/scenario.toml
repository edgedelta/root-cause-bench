[[commits.authored]]
id = "parallel-decoy"
message = "feat(pipeline): parallel batch workers"
author = "tom.oduya"
timestamp = "2026-07-24T14:15:00Z"
files = ["services/pipeline-transformer/workers.go"]
diff = '''--- a/services/pipeline-transformer/workers.go
+++ b/services/pipeline-transformer/workers.go
@@ -6,6 +6,19 @@ func (s *Server) Run(ctx context.Context) {
-	for batch := range s.batches {
-		s.ProcessBatch(ctx, batch)
-	}
+	if s.flags.Enabled("pipeline_parallel_batches") {
+		var wg sync.WaitGroup
+		for batch := range s.batches {
+			wg.Add(1)
+			go func(b []Record) {
+				defer wg.Done()
+				s.ProcessBatch(ctx, b)
+			}(batch)
+		}
+		wg.Wait()
+		return
+	}
+	for batch := range s.batches {
+		s.ProcessBatch(ctx, batch)
+	}
 }
'''

[[commits.authored]]
