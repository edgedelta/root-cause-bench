[ground_truth]
culprit_id = "none"
blast_radius = ["billing-api"]
remediation = "roll-forward"
decoy_ids = ["parser-decoy", "sdk-bump-decoy"]
notes = "NO-CODE-CAUSE / ABSTENTION TRAP (adversarial). At 11:02 a partner refund batch delivered a malformed record, refund_id=rfnd_8842107763, currency='XBT' (not an ISO-4217 code), amount='918447e12' (not a plain decimal). payment-refund-svc's validator correctly rejects it (ERROR processing refund rfnd_8842107763: invalid currency code \"XBT\", 6/min from 11:02). Because the consumer has no DLQ, it cannot commit past a record it can't process and redelivers the SAME message forever (WARN refund consumer stalled: redelivery of message offset 448211, 4/min from 11:05) -- so refund_processed_per_min steps to 0 and refund_backlog_depth ramps to 5200 while the identical refund_id/offset fails on every retry. billing-api is the downstream victim: its status-poll RPC to payment-refund-svc blocks on the stalled consumer, so refund_poll_latency_p95_ms ramps from 11:15 (ERROR refund status poll timed out, 7/min, louder than the origin service's own errors) and the alert fires on billing-api at 11:34 -- but billing-api is blast radius, not the cause. Two trace exemplars (11:10 and 11:40) show the SAME refund_id (rfnd_8842107763) failing with the SAME 'invalid currency code \"XBT\"' error on payment-refund-svc's ProcessRefund span, on two different requests 30 minutes apart -- that is the redelivery loop made directly visible, not two different bugs. There is a guilty-looking decoy: perf(refunds): faster amount parsing (parser-decoy), authored 10:30, deployed to payment-refund-svc at 10:55 -- only 7 minutes before onset, satisfying every 'blame the pre-onset deploy' heuristic. Its diff touches services/refunds/parse.go and swaps strconv.ParseFloat for a hand-rolled fast path that falls back to strconv for any non-trivial string -- behaviorally identical for all inputs, and crucially it cannot be the cause: the fault message is an INVALID CURRENCY error, which lives in a different, untouched file (services/refunds/validate.go) that this diff never mentions and never modifies -- a parsing tweak in parse.go cannot originate a validation rejection whose logic is defined elsewhere. Exoneration is also visible in the telemetry: refunds continued to settle normally for the full 7 minutes between the parser deploy (10:55) and the actual onset (11:02) -- INFO refund settled rows continue on payment-refund-svc throughout that window at the normal rate, with no backlog growth and no errors, proving the 10:55 deploy did not break anything; the break coincides exactly with the poison record's arrival at 11:02, not with the deploy. A second decoy, chore(refunds): bump partner sdk 3.2.1->3.2.2 (sdk-bump-decoy), deploys at 11:20, close to the 11:34 alert; its diff is a go.mod/go.sum version bump only -- no code changes at all, so it cannot produce any runtime behavior, let alone a validation error naming a specific currency code. 12 auto-generated background deploys (>=4 pre-onset) across all three services add further noise, none touching refund parsing, validation, or the consumer loop. The poison record is DATA, not CODE: it arrived from partner-gateway as part of a partner-submitted batch, and no commit in the window authored or could have authored that record's contents. Correct answer: root_cause_commit='none'. first_failing_service=payment-refund-svc (its validator is where the rejection loop starts); blast_radius=[billing-api] (times out waiting on the stalled consumer). Remediation: roll-forward -- ship a fix that adds a dead-letter queue / skip-and-quarantine path for unparseable records (specifically rfnd_8842107763) so the consumer can advance past the poison record; no rollback of any commit fixes this, since no commit caused it."
