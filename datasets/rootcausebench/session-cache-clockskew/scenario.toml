[[commits.authored]]
id = "culprit"
message = "perf(session-cache): approximate LFU eviction"
author = "marco.silva"
timestamp = "2026-07-24T09:05:00Z"
files = ["services/session-cache/eviction.go"]
diff = '''--- a/services/session-cache/eviction.go
+++ b/services/session-cache/eviction.go
@@ -6,8 +6,8 @@ type Cache struct {
-	mu    sync.Mutex
-	items map[string]*list.Element
-	lru   *list.List
-	cap   int
+	mu    sync.Mutex
+	items map[string][]byte
+	freq  map[string]int64
+	cap   int
+	rng   *rand.Rand
 }

 func (c *Cache) Set(key string, val []byte) {
 	c.mu.Lock()
 	defer c.mu.Unlock()
-	if elem, ok := c.items[key]; ok {
-		c.lru.MoveToFront(elem)
-		elem.Value.(*entry).val = val
-		return
-	}
-	if len(c.items) >= c.cap {
-		c.evictOne()
-	}
-	elem := c.lru.PushFront(&entry{key: key, val: val})
-	c.items[key] = elem
+	if _, ok := c.items[key]; !ok && len(c.items) >= c.cap {
+		c.evictOne()
+	}
+	c.items[key] = val
+	c.freq[key] = 1
 }

 func (c *Cache) Get(key string) ([]byte, bool) {
 	c.mu.Lock()
 	defer c.mu.Unlock()
-	elem, ok := c.items[key]
-	if !ok {
-		return nil, false
-	}
-	c.lru.MoveToFront(elem)
-	return elem.Value.(*entry).val, true
+	val, ok := c.items[key]
+	return val, ok
 }

 func (c *Cache) evictOne() {
-	elem := c.lru.Back()
-	if elem == nil {
-		return
-	}
-	c.lru.Remove(elem)
-	delete(c.items, elem.Value.(*entry).key)
+	const sampleSize = 3
+	keys := make([]string, 0, len(c.items))
+	for k := range c.items {
+		keys = append(keys, k)
+	}
+	victim, minFreq := "", int64(math.MaxInt64)
+	for i := 0; i < sampleSize; i++ {
+		k := keys[c.rng.Intn(len(keys))]
+		if f := c.freq[k]; f < minFreq {
+			minFreq, victim = f, k
+		}
+	}
+	delete(c.items, victim)
+	delete(c.freq, victim)
 }
'''

