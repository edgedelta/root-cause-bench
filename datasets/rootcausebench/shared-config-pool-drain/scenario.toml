[[commits.authored]]
id = "culprit"
message = "refactor(dbpool): make acquire timeout configurable"
author = "jan.kowalski"
timestamp = "2026-07-20T07:40:00Z"
files = ["pkg/dbpool/config.go"]
diff = '''--- a/pkg/dbpool/config.go
+++ b/pkg/dbpool/config.go
@@ -18,9 +18,10 @@ type PoolConfig struct {
 func FromEnv(cfg *envconf.Loader) PoolConfig {
 	return PoolConfig{
 		MaxConns:       cfg.Int("db.pool_max_conns", 20),
-		// acquire blocks until a connection frees up or the pool
-		// timeout elapses.
-		AcquireTimeout: cfg.Duration("db.pool_timeout", 30*time.Second),
+		// acquire timeout is now tunable per service in milliseconds.
+		AcquireTimeout: time.Duration(
+			cfg.Int("db.pool_timeout_ms", 3000)) * time.Millisecond,
 	}
 }
'''

[[commits.authored]]
id = "retry-decoy"
message = "feat(checkout): bounded retry for charge rpc"
author = "mei.chen"
timestamp = "2026-07-20T09:05:00Z"
files = ["services/checkout/charge.go"]
diff = '''--- a/services/checkout/charge.go
+++ b/services/checkout/charge.go
@@ -41,7 +41,18 @@ func (s *Server) charge(ctx context.Context, req *pb.ChargeRequest) (*pb.ChargeResponse, error) {
-	return s.payments.Charge(ctx, req)
+	if !s.flags.Enabled("charge_retry_enabled") {
+		return s.payments.Charge(ctx, req)
+	}
+	var lastErr error
+	for attempt := 0; attempt < 2; attempt++ {
+		resp, err := s.payments.Charge(ctx, req)
+		if err == nil || !errors.Is(err, ErrTransient) {
+			return resp, err
+		}
+		lastErr = err
+		time.Sleep(time.Duration(attempt+1) * 50 * time.Millisecond)
+	}
+	return nil, lastErr
 }
'''

