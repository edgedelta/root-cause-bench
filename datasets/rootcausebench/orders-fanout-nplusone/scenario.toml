[ground_truth]
culprit_id = "culprit"
first_failing_service = "orders-api"
blast_radius = ["frontend"]
remediation = "rollback"
decoy_ids = ["cache-decoy", "index-decoy", "pool-tune-decoy", "innocent-near-alert"]
notes = "BEYOND-CONTEXT / MONOREPO (adversarial, chunk 2). 286 commits over 72h; log_rps 0.45 produces well over 20MB of telemetry across logs/metrics/traces/patterns — the data cannot be read whole, it must be sliced. Culprit is 'refactor(orders): simplify item hydration' (services/orders-api/items.go), authored 2026-07-25T02:10Z and deployed to orders-api at 02:40Z, ~30h before the alert. The diff swaps a single batched query (`SELECT ... FROM order_items WHERE order_id IN (?)`) for a loop that calls `r.itemsClient.GetItem(ctx, id)` once per item id — a classic N+1 fan-out. The comment only says 'simplify' and never names the fanout, so the fault must be read from the code: one query per order became one query per item. db_queries_per_request (orders-api) ramps from a baseline of 3 starting 2026-07-25T02:45Z — 5 minutes after the culprit's own deploy — up to a ~85 plateau by 2026-07-26T06:40Z, a 28-hour ramp that tracks cart sizes growing through the window. orders_latency_p99_ms, by contrast, stays under the 1500ms threshold for most of that same window: per-query overhead only becomes latency-dominant once the fan-out width is large enough, so p99 is flat near baseline (220ms) until onset (2026-07-26T06:40Z, chosen where the alerting metric's own ramp visibly accelerates) and then ramps quickly to a ~1650ms plateau by 08:35Z, crossing the 1500ms threshold a few minutes before the alert fires at 08:40Z — a ~30h delayed onset relative to the actual cause. A low-rate WARN ('order item lookups creeping above baseline as cart sizes grow', 0.2/min) is present in orders-api logs from 2026-07-25T05:00Z onward, many hours before either trap below deploys, establishing in the data itself that the fan-out was already underway before those commits shipped. One exemplar trace makes the mechanism directly visible: trace ffffffffffffffffffffffffffff0002 (2026-07-26T08:25Z) shows a single ListOrders span (1600ms, ERROR 'item hydration exceeded latency budget') fanning out into twelve sequential 'db.query order_items' child spans (130ms each, all status OK) instead of one batched call — the N+1 signature made directly visible, corroborated by a second independent exemplar (ffffffffffffffffffffffffffff0003, 08:33Z, also twelve ~135ms child spans). A pre-deploy healthy exemplar (ffffffffffffffffffffffffffff0001, 2026-07-24T10:00Z) shows the same code path issuing exactly one 'db.query order_items' span (8ms) for contrast — trace sampling is not degraded in this scenario, so the fan-out is directly countable in the data, not just inferable from metrics. Two mechanism-traps deploy pre-onset to orders-api, the causally-relevant service, and both are exonerable purely by code semantics. (1) cache-decoy ('feat(orders): cache order summaries', deployed 2026-07-26T02:40Z, 6h pre-alert) adds a brand-new order-summary cache lookup that reads as exactly the kind of change that could explain shifting query patterns — but flags.json shows orders_summary_cache was created OFF by greta.holm at 02:35Z and never flipped for the rest of the window; every call falls straight through `if !r.flags.Enabled(...)` to the unchanged `loadSummaryFromDB` path, so the new code never executes and cannot have added or removed a single query. (2) index-decoy ('chore(db): add index on order_items(order_id)', deployed 2026-07-26T05:40Z, 3h pre-alert) lands on the exact table driving the regression and looks like a database change gone wrong — but it is an index ADDITION (`CREATE INDEX ... ON order_items (order_id)`), the wrong direction entirely: a new index can only speed up lookups by order_id (precisely the per-item GetItem calls the culprit introduced), it cannot manufacture extra queries or slow anything down. Both traps also deploy hours after db_queries_per_request had already been ramping for a day, so timing corroborates the mechanism argument without being required to carry it alone. pool-tune-decoy ('perf(orders-api): raise db connection pool max size', deployed 2026-07-25T14:15Z, mid-ramp) raises MaxConns 20->40 — more headroom for concurrent connections, the opposite of what would cause a query-count blowup; it cannot manufacture additional per-request queries and if anything relieves contention. innocent-near-alert ('feat(dashboard): add order-volume widget', dashboard-svc, deployed 2026-07-26T08:32Z, 8 minutes before fired_at) is classic innocent-deploy-near-alert bait: a new read-only dashboard widget with no path into orders-api's request-handling code. The 28 deploys_auto entries (24+ pre-onset, cyclic across all 8 services) are routine dependency/docs/CI/test noise touching none of items.go, summary_cache.go, the migration, or dbpool.go. Patterns are victim-first: frontend's 'order-history page timeout: upstream orders-api exceeded deadline' ERROR pattern (6/min from 2026-07-26T06:50Z, count 780) outnumbers orders-api's own incident WARN pattern ('order listing issuing far more queries than expected...', 4/min from onset, count 560) and its early precursor WARN (0.2/min, count ~308); four stale patterns_extra (pool warmup retries, disk usage, TLS renewal, kafka rebalancing; counts 42-80) on paymentservice/shippingservice/dashboard-svc/platform-api are unrelated pre-existing background chatter, well below all three incident patterns. An inventory-service warehouse_queue_depth spike (baseline 12 -> 340, 2026-07-24T18:00-20:00Z) fully self-heals a day before onset and is unrelated noise on an uninvolved service. Monorepo: route changes by files_changed paths (services/<svc>/, migrations/), not by service-named repos. first_failing_service is orders-api (its own query-count and latency metrics move first); frontend is blast radius (its order-history page times out waiting on the fanned-out upstream calls). Remediation: roll back orders-api to before the item-hydration refactor (restore the batched IN-clause load)."
