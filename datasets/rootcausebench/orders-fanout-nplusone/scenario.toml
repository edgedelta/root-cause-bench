[[commits.authored]]
id = "early-innocent"
message = "chore(orders-api): include route in request-handled log line"
author = "lena.fischer"
timestamp = "2026-07-23T09:30:00Z"
files = ["services/orders-api/log.go"]
diff = '''--- a/services/orders-api/log.go
+++ b/services/orders-api/log.go
@@ -7,2 +7,2 @@
-	log.Info("order request handled")
+	log.Info("order request handled", "route", r.URL.Path)
'''

[[commits.authored]]
id = "culprit"
message = "refactor(orders): simplify item hydration"
author = "devon.marsh"
timestamp = "2026-07-25T02:10:00Z"
files = ["services/orders-api/items.go"]
diff = '''--- a/services/orders-api/items.go
+++ b/services/orders-api/items.go
@@ -18,15 +18,12 @@ func (r *Repo) LoadOrderItems(ctx context.Context, order *Order) error {
-	ids := itemIDs(order)
-	rows, err := r.db.QueryContext(ctx,
-		`SELECT id, sku, qty, price FROM order_items WHERE order_id IN (?)`, ids)
-	if err != nil {
-		return err
-	}
-	defer rows.Close()
-	items, err := scanItems(rows)
-	if err != nil {
-		return err
-	}
-	order.Items = items
-	return nil
+	// simplify: hydrate each item independently instead of building an
+	// IN-clause parameter list.
+	for _, id := range itemIDs(order) {
+		item, err := r.itemsClient.GetItem(ctx, id)
+		if err != nil {
+			return err
+		}
+		order.Items = append(order.Items, item)
+	}
+	return nil
 }
'''

[[commits.authored]]
id = "cache-decoy"
message = "feat(orders): cache order summaries"
author = "greta.holm"
timestamp = "2026-07-26T02:10:00Z"
files = ["services/orders-api/summary_cache.go"]
diff = '''--- /dev/null
+++ b/services/orders-api/summary_cache.go
@@ -0,0 +1,14 @@
+func (r *Repo) GetOrderSummary(ctx context.Context, orderID string) (*Summary, error) {
+	if !r.flags.Enabled("orders_summary_cache") {
+		return r.loadSummaryFromDB(ctx, orderID)
+	}
+	if s, ok := r.summaryCache.Get(orderID); ok {
+		return s, nil
+	}
+	s, err := r.loadSummaryFromDB(ctx, orderID)
+	if err != nil {
+		return nil, err
+	}
+	r.summaryCache.Set(orderID, s)
+	return s, nil
+}
'''

