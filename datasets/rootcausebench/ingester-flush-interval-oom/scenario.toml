[ground_truth]
culprit_id = "culprit"
blast_radius = ["query-svc", "platform-api"]
remediation = "rollback"
decoy_ids = ["protobuf-decoy", "zstd-decoy", "query-decoy", "platform-decoy"]
notes = "MISLEADING PATTERNS (adversarial, degraded-telemetry). Culprit is 'perf(metric-ingester): adaptive flush scheduling' (authored+deployed 08:25/08:30 to metric-ingester): the diff is comment-free on both sides and reads as a harmless efficiency tweak, but it is a units bug. Old code: a fixed flushEvery := 30 * time.Second. New code: interval := time.Duration(max(30, len(b.pending)/b.ratePerMin)) * time.Second. len(b.pending) is a raw point COUNT; b.ratePerMin is the ingestion rate in points-per-MINUTE — so their quotient is naturally in units of MINUTES-of-backlog-at-current-throughput, not seconds. The code nonetheless feeds that number straight into a `* time.Second` duration, so once the backlog is large enough the quotient exceeds 30 and the flush interval balloons: the interval balloons by an order of magnitude as backlog grows (the exact value depends on load; no flush_interval gauge exists to read it), versus the intended 30s baseline, since the correct computation would have divided by a per-second rate (b.ratePerMin/60), not the per-minute figure itself. A longer interval means more points accumulate before the next flush, which raises b.pending further, which grows the quotient further — a runaway feedback loop. This is directly visible in the derived telemetry: buffered_points ramps 40k -> 2.4M and container_memory_rss_mb ramps 420MB -> 4090MB from 08:45 (15 min after the deploy, once the first few inflated intervals compound) to the OOM plateau at onset 10:20, where container_restarts steps 0 -> 5 (CrashLoopBackOff) and points_flushed_per_min collapses from ~780/min to ~95/min in the same window (the flush cadence itself, observed indirectly, not a flush_interval_s gauge — no such metric is exposed, by design, so the mechanism must be read from the code and inferred from its downstream effects). No log line or trace ever quotes '300s', '30x', or any diff constant — every incident number is derived from metric curves and cross-service timing. THE MISLEAD: patterns.json is headlined by a `[[patterns_extra]]` entry — 'gc pause exceeded budget' on query-svc, count 900, delta +3 — sitting ABOVE every real incident pattern (query-svc's own 'metric query timeout: upstream metric-ingester unresponsive' ERROR at 8/min for the 70 min from onset to window end totals 560; platform-api's 'dashboard metric query failed: upstream timeout' ERROR at 5/min for the 40 min from alert to window end totals 200; both comfortably under 900). A solver who trusts pattern-count ranking alone will fixate on query-svc GC pauses as the story. The count-900 entry is stale background chatter, not incident-caused: its delta_vs_baseline is +3 (barely above its pre-existing steady-state count), meaning virtually all 900 occurrences predate the window and are unrelated to the incident, whereas the two real incident patterns show explosive deltas (+560, +200) starting exactly at onset/alert timestamps that a careful solver can check against logs.ndjson row timestamps. Compounding the mislead: metric-ingester's own flush-degradation evidence is invisible in patterns.json by construction — its WARN log_fault ('flush cycle skipped: buffer not due', 3/min from 08:45 onward) is marked in_patterns=false, so the clusterer 'missed' it; the rows are still present verbatim in logs.ndjson (searchable by service+severity), so a solver who reads raw logs rather than trusting the patterns summary will find the one clue patterns.json omits. Two other patterns_extra entries (disk usage on auth-gateway, count 51; TLS renewal on billing-worker, count 63; both delta +2) are ordinary pre-existing background noise on services not even present in this scenario's service roster, included purely as low-count filler beneath the mislead. TRAPS (both pre-onset, both exonerated by code semantics, not timing): (1) 'perf(metric-ingester): zstd compression level 3->8' (deployed 08:05, 25 min before the culprit, same service) raises the outbound wire compression level — a CPU-shaped change that plausibly explains resource pressure on the same box that later OOMs. It is exonerated by cpu_pct: the metric has no incident.metric_faults entry at all and stays flat at its ~34% baseline (jitter only) for the entire window — if the compression bump were straining the CPU, cpu_pct would show it, and it never does; the RSS ramp that actually happens begins 40 minutes after this deploy and is driven by buffered_points, not by any CPU signal. (2) 'chore(metric-ingester): bump protobuf runtime' (deployed 07:40, 50 min before the culprit) is a semantics-preserving dependency bump: go.mod moves v1.31.0 -> v1.33.0 and the regenerated stub's header comment updates to match, with zero behavioral change to any struct, field, or serialization path touched by the flush/buffer code. Two additional innocent-looking decoys sit at classic bait positions near the visible activity: 'fix(query-svc): correct log field name in cache metrics' deploys at 10:10, 10 minutes before onset and to the service whose errors the solver will notice first — exonerated because it only renames a log field key, no behavior change, and query-svc's timeout errors don't start until 10:20, after this deploy already existed in production without incident. 'chore(platform-api): relabel dashboard latency metric tag' deploys at 10:45, 5 minutes before the alert fires on the very metric it touches — exonerated because it only changes a Prometheus label value on an existing Observe() call, it cannot manufacture latency, and metric_query_p95_ms had already been ramping for 25 minutes (since onset 10:20) before this deploy landed. first_failing_service is metric-ingester (the buffer/OOM originates there); query-svc and platform-api are blast radius as downstream/victim. 15 deploys_auto entries (>=6 pre-onset) cycle across all four services as background noise. Noise: a billing-worker invoice_queue_depth spike (baseline ~40 -> 200) from 06:40-07:10 self-heals nearly two hours before the culprit deploys at 08:30 and is unrelated red-herring noise on a service with no other role in this incident. Remediation: roll back metric-ingester to the pre-adaptive-flush build (restore the fixed 30s flushEvery)."
