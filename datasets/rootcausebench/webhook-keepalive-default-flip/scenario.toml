[ground_truth]
culprit_id = "culprit"
first_failing_service = "webhook-dispatcher"
blast_radius = ["billing-api"]
remediation = "rollback"
decoy_ids = ["buffer-pool-trap", "error-wrap-trap", "billing-decoy", "worker-bump-decoy"]
notes = "GUILTY-DECOY (adversarial, dependency-bump culprit). Culprit is 'chore(webhooks): bump httpkit 1.8.4 -> 2.0.0', authored 09:55 and deployed to webhook-dispatcher at 2026-07-23T10:10Z. The diff has two parts, and the second is the actual fault: go.mod bumps httpkit to v2, and the required call-site adaptation in internal/webhooks/client.go swaps 'httpkit.New()' (v1's package-default constructor, which kept idle connections open for reuse) for 'httpkit.NewClient(httpkit.Config{})' (v2's explicit-Config constructor). The bug is an absence, not a positive setting: Config{} is a zero-value struct, so every unset field -- including KeepAlive -- silently takes Go's zero value (disabled) instead of inheriting v1's pooling defaults. The diff's own comment only says that unset fields take their zero values -- it does not name KeepAlive, transport, or any other specific field -- so no field name is asserted to be the cause anywhere in commit text; proving it requires recognizing that a struct literal with no fields set means no keep-alive, which then explains every downstream signal. With pooled connections gone, every webhook POST now opens a fresh TCP+TLS handshake instead of reusing one; tcp_new_conns_per_s ramps 12 -> 480 from onset (2026-07-23T10:25Z, 15 minutes after the deploy, as partner webhook volume climbs through the morning) to 2026-07-23T10:55Z, tls_handshake_p95_ms ramps 18ms -> 640ms on the same schedule (the handshake-per-request tax), and webhook_dispatch_p95_ms ramps 190ms -> 4300ms by 11:05Z as the accumulating connect/handshake overhead compounds into dispatch latency. Once the OS runs out of ephemeral source ports for the churn, new connect() calls fail outright: webhook-dispatcher logs 'webhook post failed: connect: cannot assign requested address' (the real errno for ephemeral-port exhaustion, EADDRNOTAVAIL -- no magic constant, no digits, nothing quoting the diff) at 5/min from onset. billing-api is blast radius, not the cause: it never talks to httpkit and never deploys the bad client, but every delivery it is waiting on now either times out or never arrives, so its own webhook_confirmation_p99_ms (the alerting metric) and webhook_retry_queue_depth ramp starting 10:35Z -- ten minutes after webhook-dispatcher's own onset -- crossing the 4000ms alert threshold around 11:03Z and firing at 11:10Z, and its 'webhook confirmation delayed: awaiting delivery receipt past deadline' pattern (9/min from 10:35Z) ends up LOUDER over the window than webhook-dispatcher's own connect-failure pattern (5/min from 10:25Z) -- the victim outshouts the actual failing service, exactly the trap a naive 'loudest pattern wins' heuristic falls for. Two mechanism-traps deploy to webhook-dispatcher, the causally-relevant service, and both read as maximally guilty yet are exonerable purely by code semantics: (1) buffer-pool-trap ('perf(webhooks): pool request buffers', deployed 2026-07-23T09:50Z, PRE-onset) adds a sync.Pool for the byte buffer used to encode outbound JSON payloads -- a memory-shaped change that touches encodePayload, not the HTTP client or transport, and cannot open or close a socket. Its mechanism is falsified in the data itself: container_memory_rss_mb stays flat (480MB +/-3% jitter) for the entire window, including through the incident, which is exactly what a buffer-pool change touching only allocation reuse should look like, and rules out any memory-pressure-driven explanation. (2) error-wrap-trap ('refactor(webhooks): wrap dispatch errors with endpoint context', deployed 10:45Z, twenty minutes after the connect failures began) touches the exact function (Post) whose error becomes the incident's own error log line -- maximally suspicious surface match -- but the diff shows the 'webhook post failed: %w' wrapping already existed before this commit; the change only appends '(endpoint=%s)' onto an already-wrapped error for observability, and does not touch d.client, the transport, or connection handling at all. It also deploys twenty minutes AFTER tcp_new_conns_per_s had already begun ramping at onset (10:25Z) and after the connect-failure logs had already been firing for 20 minutes, so the underlying failure demonstrably predates this commit's deploy. billing-decoy (billing-api, 2026-07-23T11:06Z, 4 minutes before fired_at, and the most recent billing-api deploy before the alert) is a CSS/PDF-margin-style constant tweak on an unrelated invoice template file -- classic innocent-deploy-near-alert bait on the alerting service itself. worker-bump-decoy (partner-sync-worker, 09:15Z) is an unrelated go.mod patch bump on the uninvolved background service. The 20 deploys_auto entries (7+ pre-onset, cycling across all three services) are routine dependency/docs/CI noise touching none of go.mod's httpkit line, client.go, or dispatch.go. patterns_extra (TLS renewal, disk usage, pool warmup retries, kafka rebalancing; counts 42-66) are stale pre-existing background chatter on billing-api/partner-sync-worker, well below both incident patterns. partner-sync-worker's sync_backlog_depth spike (20 -> 300, 08:15-08:45Z) fully self-heals nearly two hours before onset and is unrelated noise on the uninvolved background service. first_failing_service is webhook-dispatcher (its own connection/handshake/dispatch metrics and connect-failure logs move first, at onset); billing-api is blast radius, waiting on deliveries that never arrive. Remediation: roll back webhook-dispatcher to the pre-2.0.0 httpkit client (or, forward-fix, construct httpkit.Config with KeepAlive explicitly enabled to match v1 defaults)."
