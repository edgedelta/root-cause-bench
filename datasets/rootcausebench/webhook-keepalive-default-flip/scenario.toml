diff = '''--- a/go.mod
+++ b/go.mod
@@ -8,7 +8,7 @@ require (
-	github.com/edgedelta/httpkit v1.8.4
+	github.com/edgedelta/httpkit v2.0.0
 )
--- a/internal/webhooks/client.go
+++ b/internal/webhooks/client.go
@@ -10,5 +10,5 @@ package webhooks
 func newDispatchClient() *httpkit.Client {
-	// httpkit.New wires package defaults, which keep idle
-	// connections open for reuse across requests.
-	return httpkit.New()
+	// v2: construct the client from an explicit Config; unset fields
+	// take their zero values.
+	return httpkit.NewClient(httpkit.Config{})
 }
'''

