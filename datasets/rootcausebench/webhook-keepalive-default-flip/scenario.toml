[[commits.authored]]
id = "buffer-pool-trap"
message = "perf(webhooks): pool request buffers"
author = "mei.chen"
timestamp = "2026-07-23T09:35:00Z"
files = ["internal/webhooks/dispatch.go"]
diff = '''--- a/internal/webhooks/dispatch.go
+++ b/internal/webhooks/dispatch.go
@@ -6,6 +6,8 @@ import (
 	"bytes"
 	"encoding/json"
+	"sync"
 )
+var bufPool = sync.Pool{New: func() any { return new(bytes.Buffer) }}
@@ -30,10 +32,13 @@ func (d *Dispatcher) encodePayload(ev Event) ([]byte, error) {
-	buf := &bytes.Buffer{}
+	buf := bufPool.Get().(*bytes.Buffer)
+	buf.Reset()
+	defer bufPool.Put(buf)
 	if err := json.NewEncoder(buf).Encode(ev); err != nil {
 		return nil, err
 	}
 	return append([]byte(nil), buf.Bytes()...), nil
 }
'''

[[commits.authored]]
