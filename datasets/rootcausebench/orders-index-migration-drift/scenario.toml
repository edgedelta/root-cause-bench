message = "feat(orders): add cursor pagination for admin export"
author = "greta.holm"
timestamp = "2026-07-24T08:50:00Z"
files = ["services/orders-api/export.go"]
diff = '''--- a/services/orders-api/export.go
+++ b/services/orders-api/export.go
@@ -20,6 +20,16 @@ func (r *Repo) ExportOrders(ctx context.Context, cursor string) ([]Order, string, error) {
-	return r.legacyExport(ctx, cursor)
+	rows, err := r.db.QueryContext(ctx, exportOrdersSQL, cursor)
+	if err != nil {
+		return nil, "", err
+	}
+	defer rows.Close()
+	var out []Order
+	for rows.Next() {
+		var o Order
+		if err := rows.Scan(&o.ID, &o.TenantID, &o.Status, &o.CreatedAt); err != nil {
+			return nil, "", err
+		}
+		out = append(out, o)
+	}
+	next := nextCursor(out)
+	return out, next, rows.Err()
 }
'''

