+++ b/services/report-scheduler/log.go
@@ -6,2 +6,2 @@
-	log.Info("report job started")
+	log.Info("report job started", "job", jobKey)
'''

[[commits.authored]]
id = "culprit"
message = "refactor(scheduler): simplify job runner"
author = "noah.becker"
timestamp = "2026-07-25T15:20:00Z"
files = ["services/report-scheduler/runner.go"]
diff = '''--- a/services/report-scheduler/runner.go
+++ b/services/report-scheduler/runner.go
@@ -11,15 +11,7 @@ func (s *Scheduler) RunReportJob(ctx context.Context, jobKey string) error {
-	lock, err := s.locks.Acquire(ctx, jobKey)
-	if err != nil {
-		if errors.Is(err, ErrHeld) {
-			return nil
-		}
-		return err
-	}
-	defer lock.Release()
-
 	report, err := s.generator.Generate(ctx, jobKey)
 	if err != nil {
 		return err
 	}
 	return s.store.Save(ctx, report)
 }
'''

[[commits.authored]]
id = "parallel-workers-decoy"
message = "feat(scheduler): enable parallel report generation workers"
author = "mei.chen"
timestamp = "2026-07-25T21:20:00Z"
files = ["services/report-scheduler/dispatch.go"]
diff = '''--- a/services/report-scheduler/dispatch.go
+++ b/services/report-scheduler/dispatch.go
@@ -8,7 +8,10 @@ func (s *Scheduler) dispatch(ctx context.Context, jobKey string) error {
-	return s.RunReportJob(ctx, jobKey)
+	if !s.flags.Enabled("scheduler_parallel_workers") {
+		return s.RunReportJob(ctx, jobKey)
+	}
+	return s.workerPool.SubmitParallel(ctx, jobKey)
 }
'''

