[ground_truth]
culprit_id = "culprit"
first_failing_service = "report-scheduler"
blast_radius = ["dashboard-svc"]
remediation = "rollback"
decoy_ids = ["parallel-workers-decoy", "dbpool-tune-decoy", "pagesize-decoy", "innocent-near-alert"]
notes = "BEYOND-CONTEXT / MONOREPO (adversarial, chunk 2). 259 commits over 72h; log_rps 0.45 produces well over 8MB of telemetry across logs/metrics/traces/patterns — the data must be sliced, not read whole. Culprit is 'refactor(scheduler): simplify job runner' (services/report-scheduler/runner.go), authored 2026-07-25T15:20Z and deployed to report-scheduler at 15:50Z, exactly 26h before the alert fires at 2026-07-26T17:50Z. The diff deletes the entire lock-guard block around report generation — `lock, err := s.locks.Acquire(ctx, jobKey)`, its ErrHeld early-return, and the paired `defer lock.Release()` — leaving RunReportJob call straight into the generator with no serialization; the commit message says only 'simplify job runner', never mentions locking, concurrency, or overlap. report-scheduler runs a cron-triggered job every 30 minutes (visible directly in logs.ndjson: a benign 'report job started' INFO line recurs on report-scheduler roughly every 30 minutes for the entire 72h window, independent of the incident — this is the cadence baseline against which the ramp must be read). Normally a report job finishes in well under 30 minutes, so the lock was rarely contended; once it is deleted, an occasional slow job no longer blocks the next cron tick from launching a second, overlapping job — and because the two jobs now compete for the same DB resources and both run slower, each subsequent 30-minute tick stacks another overlapping job on top of the last, a self-reinforcing pileup. This is the intended STAIRCASE reading: concurrent_report_jobs (report-scheduler) ramps from a baseline of 1 up to a plateau of 14 between 2026-07-25T16:20Z (the first stacking tick, 30 minutes after the culprit's own deploy) and onset — a rise that lines up, tick-for-tick, with the 30-minute cron cadence established by the 'report job started' log line; no metric field literally says 'staircase' or 'overlap', the shape must be read off the ramp against the log cadence. report_db_cpu_pct (reportdb-proxy) independently corroborates, climbing from a 22% baseline toward 94% starting 2026-07-25T18:00Z — under two hours after the concurrency ramp begins and many hours before the alerting service shows any sign of trouble — which is why first_failing_service is report-scheduler even though the eventual alert fires on dashboard-svc. report_freshness_s (dashboard-svc), by contrast, sits flat near its 40s baseline for nearly the entire window: staleness only becomes threshold-crossing once the job backlog is large enough to starve the downstream refresh, so it stays flat until onset (2026-07-26T15:30Z, chosen where the alerting metric's own ramp visibly accelerates) and then ramps to a ~1500s plateau by 17:55Z, crossing the 600s threshold around 16:26Z — well over an hour before the alert actually fires at 17:50Z. Two WARN log_faults (report-scheduler's 'report generation slow: query exceeded expected duration' and reportdb-proxy's 'database query slow: execution exceeded expected duration') each run a low-rate precursor stage that starts hours before onset and then jump in rate at onset — the toolkit merges each into a single deduped pattern entry, whose count is dominated by the onset-rate stage. dashboard-svc's own victim pattern ('report data unavailable: generation did not complete within refresh window', 6/min from 2026-07-26T15:35Z, count ~858) outnumbers both cause-side onset patterns (report-scheduler ~471, reportdb-proxy ~513), satisfying victim-first pattern loudness. Three hand-authored trace exemplars make the mechanism directly visible without naming it: a healthy pre-deploy exemplar (2026-07-24T10:00Z) shows RunReportJob(44000ms,OK) -> QueryReportData(37000ms,OK) -> RefreshReportView(480ms,OK); two independent post-onset exemplars (17:40Z and 17:45Z) show RunReportJob and QueryReportData spans blowing up to ~2-4 minutes, erroring generically with 'report generation timed out' / 'query exceeded configured timeout' — no span or log anywhere says 'overlapping', 'concurrent', or 'lock', so the mechanism must be inferred from the concurrent_report_jobs ramp and cron cadence, never read off a text string. Four mechanism-traps deploy pre-onset (except innocent-near-alert, which is post-onset bait) and are each exonerable purely by code semantics, not timing: (1) parallel-workers-decoy ('feat(scheduler): enable parallel report generation workers', deployed 2026-07-25T21:20Z, ~20h pre-alert) is the scariest-sounding commit in the scenario — it reads as though it directly explains concurrent jobs running in parallel — but flags.json shows `scheduler_parallel_workers` was created OFF at 21:15Z and never flipped anywhere in the window, so the new SubmitParallel code path is provably dead: the diff itself gates the change behind `if !s.flags.Enabled(...) { return s.RunReportJob(...) }`, meaning production traffic keeps calling the exact same function whether or not this commit ships. (2) dbpool-tune-decoy ('chore(scheduler): tune db pool max 15->25', deployed 2026-07-26T07:20Z, ~10h pre-alert) is capacity-*adding*, the wrong direction for a change that would need to shrink a resource to cause a backlog — and report_db_active_connections shows the exoneration directly: the metric is already at ~14.2 (essentially saturating the OLD 15-connection cap) by the time this commit deploys, proving the growth was organic and predates the tune; afterward it simply continues climbing to saturate the NEW 25-connection cap by onset, showing that raising the pool ceiling only deferred the same underlying growth, it never caused or fixed it. (3) pagesize-decoy ('perf(reports): raise generator page size 500->2000', deployed 2026-07-26T12:20Z, ~5h pre-alert) is exonerated by timeline plus a dedicated per-job metric: report_job_duration_s stays flat at its ~45s baseline through this deploy and for the following 40 minutes, only beginning to ramp at 13:30Z — well after the deploy and correlated instead with concurrent_report_jobs already sitting near its saturation plateau, i.e., queueing contention from job count, not per-job generator work, is what slows individual jobs. (4) innocent-near-alert ('feat(dashboard): add report queue depth widget', dashboard-svc, deployed 2026-07-26T17:40Z, 10 minutes before fired_at) is classic innocent-deploy-near-alert bait: a new read-only dashboard widget with no write path into the scheduling or generation pipeline. The 26 deploys_auto entries (20 pre-onset, cyclic across all 8 services) are routine dependency/docs/CI/test noise touching none of runner.go, dispatch.go, config.go, or generator.go. Four stale patterns_extra (pool warmup retries, disk usage, TLS renewal, webhook retries; counts 42-65) on paymentservice/shippingservice/checkoutservice/platform-api are unrelated pre-existing background chatter, well below all incident patterns. An inventory-service warehouse_queue_depth spike (baseline 12 -> 340, 2026-07-24T10:00-12:00Z) fully self-heals more than a day before the culprit even deploys and is unrelated noise on an uninvolved service. Monorepo: route changes by files_changed paths (services/<svc>/, go.mod), not by service-named repos. first_failing_service is report-scheduler (its own concurrency and the downstream DB CPU move first, many hours before dashboard-svc shows any freshness degradation); dashboard-svc is blast radius (its report refresh starves waiting on the backlogged scheduler). Remediation: roll back report-scheduler to restore the lock-guard block (`lock, err := s.locks.Acquire(ctx, jobKey)` / ErrHeld early-return / `defer lock.Release()`) around report generation."
