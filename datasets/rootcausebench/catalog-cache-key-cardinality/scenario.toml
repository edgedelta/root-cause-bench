[commits]
innocent_count = 300

[[commits.authored]]
id = "culprit"
message = "refactor(cache): scope cache keys to request context"
author = "tom.oduya"
timestamp = "2026-07-19T02:10:00Z"   # mid-history, ~30h before the alert
files = ["pkg/cache/key.go"]
diff = '''--- a/pkg/cache/key.go
+++ b/pkg/cache/key.go
@@ -9,7 +9,8 @@ func CatalogKey(req *Request) string {
-	return fmt.Sprintf("catalog:%s:%s", req.Locale, req.PageToken)
+	// include the request context so per-session experiments can vary results
+	return fmt.Sprintf("catalog:%s:%s:%s",
+		req.Locale, req.PageToken, req.SessionID)
 }
'''

[[commits.authored]]
id = "redis-decoy"
message = "perf(catalog): tune redis client timeouts"
author = "lena.fischer"
timestamp = "2026-07-20T07:50:00Z"
files = ["services/catalog/redis.go"]
diff = '''--- a/services/catalog/redis.go
+++ b/services/catalog/redis.go
@@ -14,2 +14,2 @@
-	ReadTimeout:  500 * time.Millisecond,
+	ReadTimeout:  400 * time.Millisecond,
'''

[[commits.authored]]
id = "dashboard-decoy"
message = "feat(dashboard): add saved-view sharing"
author = "ahmet.yilmaz"
timestamp = "2026-07-20T08:05:00Z"
files = ["services/dashboard/views.go"]
diff = '''--- a/services/dashboard/views.go
+++ b/services/dashboard/views.go
@@ -30,0 +31,4 @@
+func (s *Server) shareView(ctx context.Context, id string) (string, error) {
+	return s.links.Create(ctx, id)
+}
'''

[[deploys]]
service = "catalogservice"
commit = "culprit"
timestamp = "2026-07-19T02:40:00Z"
[[deploys]]
service = "catalogservice"
commit = "redis-decoy"
timestamp = "2026-07-20T08:15:00Z"
[[deploys]]
service = "dashboard-svc"
commit = "dashboard-decoy"
timestamp = "2026-07-20T08:32:00Z"

[ground_truth]
culprit_id = "culprit"
blast_radius = ["frontend"]
remediation = "rollback"
decoy_ids = ["redis-decoy", "dashboard-decoy"]
notes = "BEYOND-CONTEXT / MONOREPO (adversarial). 303 commits over 73h; ~12MB of telemetry — the data cannot be read whole, it must be sliced. Culprit is the mid-history pkg/cache/key.go commit (deployed to catalogservice 2026-07-19T02:40Z, ~30h before the alert): adding req.SessionID to the catalog cache key explodes key cardinality, so cache_hit_ratio decays from 0.97 toward 0.31 and redis_mem_mb ramps 240->3900 starting right after that deploy, while catalog_latency_p99_ms only breaches threshold on 07-20 as the DB fallback saturates — a very long delayed onset. redis-decoy ('tune redis client timeouts', catalogservice, deployed 08:15) is the guilty-looking near-onset change on the right service, but hit-ratio decay predates it by ~29h and its diff only lowers a client read timeout. dashboard-decoy (08:32) is the innocent-position deploy. Monorepo: route changes by files_changed paths (services/<svc>/, pkg/), not by service-named repos. Remediation: roll back catalogservice to before the cache-key change."
