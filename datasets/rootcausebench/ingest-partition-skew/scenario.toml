[ground_truth]
culprit_id = "culprit"
first_failing_service = "kafka-metric-ingestor"
blast_radius = ["dashboard-svc"]
remediation = "rollback"
decoy_ids = ["kafka-bump-decoy", "poll-records-decoy", "fetch-bytes-decoy", "producer-batch-size-decoy", "innocent-near-alert"]
notes = "BEYOND-CONTEXT / MONOREPO (adversarial, chunk 2). 267 commits over 72h; log_rps 0.45 produces well over 8MB of telemetry across logs/metrics/traces/patterns — the data must be sliced, not read whole. Culprit is 'refactor(ingest): stable partitioning for tenant affinity' (services/event-producer/partition.go), authored 2026-07-25T17:20Z and deployed to event-producer at 17:50Z, ~20h before the alert fires at 2026-07-26T13:50Z. The diff swaps the partition-key field: `hash(msg.DeviceID)` becomes `hash(msg.TenantID)` — the comment only mentions 'per-tenant windowed aggregation', never skew or overload, so the fault must be read from the code: routing by tenant instead of device means every event from one whale tenant now hashes to the SAME partition instead of being spread across devices. The mechanism is only visible as a DERIVED signature, never named directly: kafka-metric-ingestor exposes eight per-partition lag gauges, consumer_lag_partition_0 through _7. Partitions 0-6 stay flat at their own baselines (210-380, jitter 0.15) for the entire window — direct proof the skew is confined to one partition, not a global consumer problem. consumer_lag_partition_7 alone ramps from a baseline of 300 starting 2026-07-25T18:50Z (1h after the culprit's own deploy) up to a ~900,000 plateau by 2026-07-26T09:50Z — a 15h ramp that is flatly inconsistent with any of the consumer-side decoys below, all of which deploy well after that ramp is already established. messages_consumed_per_sec (kafka-metric-ingestor) independently corroborates: it starts declining from its 850 baseline toward ~400 at 2026-07-26T05:00Z, hours before the alerting service shows any sign of trouble — this is why first_failing_service is kafka-metric-ingestor even though the causal commit shipped to event-producer. chart_data_staleness_s (dashboard-svc), by contrast, stays near its 45s baseline for nearly the whole window: staleness only becomes threshold-crossing once the backlog on partition 7 is large enough to starve the downstream refresh job, so it is flat until onset (2026-07-26T11:50Z, chosen where the alerting metric's own ramp visibly accelerates) and then ramps to a ~1400s plateau by 13:55Z, crossing the 900s threshold a few minutes before the alert fires — an ~18h delayed onset relative to the actual cause. Two WARN log_faults on kafka-metric-ingestor ('rebalance triggered: max poll interval exceeded') establish the timeline in the data itself: a low precursor rate (0.2/min, count 196) runs from 2026-07-25T19:30Z — 40 minutes after the lag ramp begins and many hours before either mechanism-trap deploys — then jumps to 4/min (count 480) at onset. dashboard-svc's own victim pattern ('chart render served stale data: upstream ingest lag exceeded refresh window', 6/min from 2026-07-26T11:55Z, count 750) outnumbers kafka-metric-ingestor's onset-linked WARN pattern (480), satisfying victim-first pattern loudness. Three hand-authored trace exemplars make the mechanism directly visible: a healthy pre-deploy exemplar (2026-07-24T10:00Z) shows PublishBatch(45ms,OK) -> ConsumeBatch(55ms,OK) -> RefreshChartData(28ms,OK); two independent post-onset exemplars (2026-07-26T13:40Z and 13:47Z) show ConsumeBatch spans blowing up to ~41-45 seconds, erroring 'poll interval exceeded while draining partition 7 backlog; rebalance triggered', which propagates directly into RefreshChartData spans erroring 'chart data stale: upstream ingest lag exceeded refresh window' — the derived partition-7 signature corroborated across two independent traces, with no numeric fingerprint from any diff quoted in the text. Five mechanism-traps deploy pre-onset (except innocent-near-alert, which is post-onset bait) and are each exonerable purely by code semantics, not timing: (1) kafka-bump-decoy ('chore(consumer): bump kafka client 3.6->3.7', deployed 2026-07-26T05:50Z, 8h pre-alert) touches go.mod plus one renamed constant, `kafka.RangeAssignor` -> `kafka.RangeAssignorName` — the client's v3.7 release simply renamed the identifier for the same range-assignor strategy, so the diff is semantics-preserving: no partition-assignment behavior changes, and by the time it deploys consumer_lag_partition_7 has already been ramping for 11 hours. (2) poll-records-decoy ('perf(consumer): raise max.poll.records 500->1000', deployed 2026-07-26T09:35Z, 4h pre-alert) is the classic plausible-overload reading — it touches the exact consumer whose logs show poll-interval WARNs — but it is exonerated on two independent grounds: it is a global per-consumer setting applied uniformly across every partition a consumer polls, so it cannot manufacture a single-partition-7-only divergence while partitions 0-6 stay flat; and directionally it *raises* the record ceiling per poll call, a throughput-enhancing change, the wrong direction for a change that would need to shrink capacity to cause a backlog. It also deploys 15 hours after the partition-7 ramp began. (3) fetch-bytes-decoy ('perf(consumer): raise fetch.max.bytes 1MB->5MB', deployed 2026-07-26T10:35Z, 3h pre-alert) is exonerated the same way: fetch-size caps apply uniformly across the whole poll response, not per-partition, and raising the byte ceiling is again capacity-increasing, not capacity-shrinking. (4) producer-batch-size-decoy ('perf(producer): raise batch.size for higher throughput', event-producer, deployed 2026-07-24T09:15Z) rides on the causally-relevant service but only tunes how many records are grouped per network send — batch.size has no path into the partitionFor() key-selection function, and it deploys a full day before the partition-7 ramp even begins, so timing alone would also clear it. (5) innocent-near-alert ('feat(dashboard): add ingest-throughput widget', dashboard-svc, deployed 2026-07-26T13:40Z, 10 minutes before fired_at) is classic innocent-deploy-near-alert bait: a new read-only dashboard widget with no write path into the ingestion pipeline. The 26 deploys_auto entries (20 pre-onset, cyclic across all 8 services) are routine dependency/docs/CI/test noise touching none of partition.go, client.go, consumer_config.go, or the producer config. Four stale patterns_extra (pool warmup retries, disk usage, TLS renewal, cron-sync-skipped; counts 42-65) on paymentservice/shippingservice/checkoutservice/platform-api are unrelated pre-existing background chatter, well below all incident patterns. An inventory-service warehouse_queue_depth spike (baseline 12 -> 340, 2026-07-24T18:00-20:00Z) fully self-heals a day before the culprit even deploys and is unrelated noise on an uninvolved service. Monorepo: route changes by files_changed paths (services/<svc>/, go.mod), not by service-named repos. first_failing_service is kafka-metric-ingestor (its own per-partition lag and throughput metrics move first, many hours before dashboard-svc shows any staleness); dashboard-svc is blast radius (its chart refresh job starves waiting on the backlogged consumer). Remediation: roll back event-producer to the device-id-based partitioning key (restore `hash(msg.DeviceID)`)."
