# root-cause-bench — adversarial-tier mid-field probe: three models tied at 96%
# base-benchmark pass rate (indistinguishable on the current leaderboard) x 3
# attempts x all four adversarial scenarios. Success = the tier SPREADS them.
# Usage: set -a && source .env && set +a && harbor run -c configs/probe-adversarial-midfield.yaml -y
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 2
quiet: false

environment:
  type: docker

agents:
  - name: terminus-2
    model_name: openrouter/openai/gpt-5.5
  - name: terminus-2
    model_name: openrouter/google/gemini-3.1-pro-preview
  - name: terminus-2
    model_name: openrouter/anthropic/claude-sonnet-4.6

datasets:
  - path: datasets/rootcausebench
    task_names:
      - shared-config-pool-drain
      - catalog-cache-key-cardinality
      - notification-buffer-oom-silent
      - payment-refund-poison-batch
