# root-cause-bench — adversarial-tier leaderboard run: 12 adversarial scenarios x
# 22 models x 3 attempts. Merged with the frozen v2 base-tier job dirs via
# scripts/gen_results.py (same conditions: terminus-2, 1800s timeout).
# fable-5 runs separately at low concurrency (rate limits) — see
# configs/leaderboard-adversarial-fable.yaml.
# Usage: set -a && source .env && set +a && harbor run -c configs/leaderboard-adversarial-docker.yaml -y
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 8
quiet: false

environment:
  type: docker

